name: Check channel and publish

on:
  schedule:
    - cron: '17 * * * *' # every hour
  workflow_dispatch:
    inputs:
      force_research:
        description: Run the video ideas research now, even if it ran in the last 20 hours
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Take snapshot
        run: node collect.mjs

      - name: Research similar Shorts (daily)
        run: node research.mjs
        continue-on-error: true
        env:
          FORCE: ${{ inputs.force_research && '1' || '' }}

      - name: Save snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots.json data/research.json
          git diff --cached --quiet || git commit -m "Snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: Prepare site
        run: mkdir -p _site/data && cp index.html style.css app.js _site/ && cp data/snapshots.json data/research.json _site/data/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
